services:
  web:
    build: .
    image: minha-web:3.0
    ports:
      - "8080:80"
    networks:
      - backend
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aluno
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: escola
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
  adminer:
    image: adminer
    ports:
      - "8081:8080"
    networks:
      - backend
    depends_on:
      - db
volumes:
  pgdata:
networks:
  backend:
